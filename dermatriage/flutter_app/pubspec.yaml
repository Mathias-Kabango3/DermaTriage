name: dermatriage
description: "DermaTriage — offline AI-assisted skin disease triage for community health workers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Localization: English + Kinyarwanda (see lib/l10n/app_localizations.dart).
  flutter_localizations:
    sdk: flutter

  # Online authentication (CHW accounts). Auth happens online so the project
  # owner can track registered CHWs; Firebase persists the session locally so
  # the app then works offline for triage. Firestore holds extra profile
  # fields (region/facility) that Firebase Auth itself cannot store.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # On-device inference
  # 0.11.0 required: 0.10.x uses UnmodifiableUint8ListView, removed in Dart 3.4+
  tflite_flutter: ^0.11.0
  image: ^4.1.3

  # Camera & permissions
  camera: ^0.10.5
  permission_handler: ^11.1.0

  # State management
  provider: ^6.1.1

  # Local persistence
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^12.1.1

  # UI / assets
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9

  # Utilities
  uuid: ^4.2.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.0
  # Healthy-skin contribution photo hosting (Cloudinary — Firebase Storage
  # requires the Blaze billing plan even for the free tier's quota, see
  # cloudinary_config.dart for why this project uses Cloudinary instead).
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.4.2

# App launcher icon (run: dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 23

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/fonts/
    - assets/reference/
    - assets/reference/images/
