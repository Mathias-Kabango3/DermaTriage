# HAM10000 + PASSION config — extend further when Fitzpatrick17k is available
# ============================================================================
# DermaTriage — ML Pipeline Configuration
# Skin disease triage: teacher training, GAN augmentation, KD, quantisation.
# All hyperparameters for the project live here. Override via CLI as needed.
# ============================================================================

# ----------------------------------------------------------------------------
# Data
# ----------------------------------------------------------------------------
data:
  fitzpatrick17k_path: null
  ham10000_path: data/raw/ham10000
  passion_path: data/raw/passion
  synthetic_path: data/synthetic
  processed_path: data/processed
  image_size: 224
  num_classes: 11
  splits:
    train: 0.80
    val: 0.10
    test: 0.10
  # Merged HAM10000 (7, indices 0-6) + PASSION (4, indices 7-10) union schema.
  class_names:
    - melanoma              # 0  HAM mel
    - melanocytic_nevus     # 1  HAM nv
    - basal_cell_carcinoma  # 2  HAM bcc
    - actinic_keratosis     # 3  HAM akiec
    - benign_keratosis      # 4  HAM bkl
    - dermatofibroma        # 5  HAM df
    - vascular_lesion       # 6  HAM vasc
    - tinea_infection       # 7  PASSION Fungal
    - scabies               # 8  PASSION Scabies
    - eczema_dermatitis     # 9  PASSION Eczema
    - other_ntd             # 10 PASSION Others
  # PASSION provides real Fitzpatrick labels; types 4-6 are the dark-skin focus.
  fitzpatrick_dark_types: [4, 5, 6]

# ----------------------------------------------------------------------------
# Teacher model (high-capacity, trained on real + synthetic data)
# ----------------------------------------------------------------------------
teacher:
  architecture: efficientnet_b4
  pretrained: true
  epochs: 30  # HAM10000 is smaller and converges faster than the 12-class set
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 5
  label_smoothing: 0.1

# ----------------------------------------------------------------------------
# Knowledge distillation (teacher -> compact student for on-device inference)
# ----------------------------------------------------------------------------
distillation:
  student_architecture: mobilenetv3_small
  temperature: 4.0
  alpha: 0.3            # weight on soft (KD) loss vs. hard (CE) loss
  epochs: 40
  batch_size: 64
  lr: 3.0e-4

# ----------------------------------------------------------------------------
# GAN augmentation (WGAN-GP) — synthesise dark-skin disease images
# ----------------------------------------------------------------------------
gan:
  architecture: wgan_gp
  z_dim: 100
  fitzpatrick_classes: [4, 5, 6]
  disease_classes: 8
  epochs: 200
  batch_size: 16
  lr_g: 2.0e-4
  lr_d: 2.0e-4
  beta1: 0.0
  beta2: 0.9
  n_critic: 5            # discriminator updates per generator update
  lambda_gp: 10          # gradient penalty coefficient
  synthetic_ratio: 0.30  # fraction of synthetic samples added to training set
  checkpoint_every: 25   # save a GAN checkpoint every N epochs
  checkpoint_dir: models/gan  # where GAN checkpoints are written

# ----------------------------------------------------------------------------
# Quantisation (export student to TFLite for mobile deployment)
# ----------------------------------------------------------------------------
quantisation:
  mode: int8_dynamic
  tflite_output_path: models/student_int8.tflite
  target_size_mb: 10
  target_latency_ms: 2000

# ----------------------------------------------------------------------------
# Evaluation — Deployment Viability Score (DVS) and accuracy targets
# ----------------------------------------------------------------------------
evaluation:
  dvs_weights:
    accuracy: 0.40
    latency: 0.25
    model_size: 0.15
    equity: 0.20
  top1_target: 0.78
  metrics_output: outputs/metrics  # where eval reports / plots are written

# ----------------------------------------------------------------------------
# Experiment tracking
# ----------------------------------------------------------------------------
wandb:
  entity: dermatriage
  project: dermatriage-ml
